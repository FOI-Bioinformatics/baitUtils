[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baitUtils"
dynamic = ["version"]
description = "Tools for oligo bait design, evaluation and comparison: sequence statistics, mapping, coverage, gap filling and reports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Andreas Sjödin", email = "andreas.sjodin@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.0.0",
    "biopython>=1.80",
    "plotly>=5.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
bedtools = ["pybedtools>=0.9.0"]
all = ["pybedtools>=0.9.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=6.0.0",
    "ruff>=0.1.0",
    "flake8>=6.0.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/FOI-Bioinformatics/baitUtils"
Changelog = "https://github.com/FOI-Bioinformatics/baitUtils/blob/main/CHANGELOG.md"

[project.scripts]
baitUtils = "baitUtils.__main__:main"

[tool.setuptools]
packages = ["baitUtils", "baitUtils.templates"]
include-package-data = true

[tool.setuptools.package-data]
baitUtils = ["templates/*.css", "templates/*.js"]

[tool.setuptools.dynamic]
version = {attr = "baitUtils._version.__version__"}
