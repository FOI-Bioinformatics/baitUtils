name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.3)'
        required: true

jobs:
  test-before-release:
    uses: ./.github/workflows/ci.yml
    
  build-and-release:
    runs-on: ubuntu-latest
    needs: test-before-release
    if: success()
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Extract version from tag
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=${{ github.event.inputs.version }}
          VERSION=${VERSION#v}
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Verify version in code matches tag
      run: |
        PACKAGE_VERSION=$(python -c "from baitUtils._version import __version__; print(__version__)")
        echo "Package version: $PACKAGE_VERSION"
        echo "Tag version: ${{ steps.get_version.outputs.VERSION }}"
        if [ "$PACKAGE_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
          echo "Version mismatch: package $PACKAGE_VERSION, tag ${{ steps.get_version.outputs.VERSION }}"
          exit 1
        fi
        echo "Version matches"

    - name: Build distribution packages
      run: |
        python -m build

    - name: Verify distribution packages
      run: |
        twine check dist/*
        echo "Distribution packages are valid"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: false
        files: |
          dist/*.tar.gz
          dist/*.whl
        body: |
          See CHANGELOG.md for the changes in this release.

          Install with `pip install baitUtils==${{ steps.get_version.outputs.VERSION }}`
          once the package is on PyPI, or from the attached source distribution.
